[project]
name = "txddns"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyopenssl>=25.1.0",
    "service-identity>=24.2.0",
    "twisted>=25.5.0",
    "txredisapi>=1.4.11",
    "typer>=0.16.0",
]

[dependency-groups]
dev = [
    "podman-compose>=1.4.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [""]
